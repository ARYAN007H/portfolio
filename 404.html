<script>try{if(localStorage.getItem("aryan-v2-theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
<title>Page not found — Aryan™ Press</title>
<script>
/* GitHub Pages serves this file at any missing URL, however deep.
   Point relative links at the site root: /<repo>/ on github.io, / elsewhere. */
(function(){var seg=location.pathname.split('/')[1];var base=(location.hostname.slice(-9)==='github.io'&&seg)?'/'+seg+'/':'/';document.write('<base href="'+base+'">')})();
</script>
<link rel="stylesheet" href="fonts.css?v=1">
<link rel="stylesheet" href="style.css?v=9">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
<header class="masthead">
  <a class="mast-logo" href="index.html">Aryan<em>™</em> Press</a>
</header>
<main class="spec-hero" id="content">
  <p class="spec-kicker">Error 404</p>
  <h1 class="spec-title">Card not found</h1>
  <p class="spec-tagline">That page isn’t in the drawer. It may have moved, or the link has a typo.</p>
  <div class="spec-actions">
    <a class="btn primary" href="index.html#shelf">Browse the catalogue</a>
    <a class="btn" href="index.html">Front page</a>
  </div>
</main>
</body>
</html>
